  <rect x="864" y="320" width="76" height="22" rx="11" fill="#1f2937"/><text x="902" y="335" text-anchor="middle" class="mono" font-size="11" fill="#e2e8f0">Bayesian</text>
  <rect x="948" y="320" width="48" height="22" rx="11" fill="#1f2937"/><text x="972" y="335" text-anchor="middle" class="mono" font-size="11" fill="#e2e8f0">HMM</text>
