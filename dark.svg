  <text x="864" y="262" class="sans" font-size="20" font-weight="700" fill="#f8fafc">ElastoRisk</text>
  <text x="864" y="288" class="mono" font-size="13" fill="#94a3b8">Reliability-aware elastography analysis using</text>
