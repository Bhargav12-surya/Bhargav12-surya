<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Bhargav Ram GitHub Banner</title>
<desc id="desc">A modern dark GitHub banner introducing Bhargav Ram as an AI and Data Science undergraduate with featured project highlights.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b1120"/>
    <stop offset="55%" stop-color="#111827"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="55%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#10b981"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
  </filter>
  <style>
    .sans{font-family: Inter,Segoe UI,Arial,sans-serif}
    .mono{font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .pulse{animation:pulse 3.2s ease-in-out infinite}
    .float{animation:float 6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    @keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-6px)}}
    @media (prefers-reduced-motion:reduce){.pulse,.float{animation:none}}
  </style>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<circle cx="998" cy="76" r="126" fill="#8b5cf6" opacity="0.11"/>
<circle cx="1088" cy="306" r="160" fill="#22d3ee" opacity="0.09"/>
<circle cx="178" cy="62" r="110" fill="#10b981" opacity="0.08"/>

