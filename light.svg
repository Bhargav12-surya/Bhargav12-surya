<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="ttl desc">
<title id="ttl">Bhargav Ram — AI and Data Science GitHub profile banner</title>
<desc id="desc">A two-column terminal interface with a neural network visual, name, education, skills, and GitHub handle. Subtle decorative animations respect reduced-motion preferences.</desc>
<defs>
  <linearGradient id="fillBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FF"/><stop offset="1" stop-color="#EFF5FC"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D44CD"/><stop offset="1" stop-color="#087E9B"/></linearGradient>
  <linearGradient id="under" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6D44CD"/><stop offset=".60" stop-color="#087E9B"/><stop offset="1" stop-color="#087A61"/></linearGradient>
  <clipPath id="neuralClip"><rect x="48" y="115" width="425" height="402" rx="15"/></clipPath>
  <style>
    .mono {font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace}
    .sans {font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .orbit{animation:rotate 28s linear infinite;transform-origin:260px 312px}
    .orbit-reverse{animation:rotate 35s linear infinite reverse;transform-origin:260px 312px}
    .cursor{animation:blink 1.25s steps(1) infinite}
    @keyframes rotate{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.48}}
    @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.orbit,.orbit-reverse,.pulse,.cursor{animation:none}}
  </style>
</defs>
